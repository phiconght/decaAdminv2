# Thay the domain.com bang domain that cua ban truoc khi dung

# API subdomain
server {
  listen 443 ssl;
  server_name api.domain.com;
  ssl_certificate     /etc/nginx/certs/live/api.domain.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/api.domain.com/privkey.pem;
  client_max_body_size 12M;
  location /api/ {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# Admin subdomain
server {
  listen 443 ssl;
  server_name admin.domain.com;
  ssl_certificate     /etc/nginx/certs/live/admin.domain.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/admin.domain.com/privkey.pem;
  root /usr/share/nginx/html/admin;
  client_max_body_size 12M;
  location /api/ {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}

# App (Web) subdomain
server {
  listen 443 ssl;
  server_name app.domain.com;
  ssl_certificate     /etc/nginx/certs/live/app.domain.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/app.domain.com/privkey.pem;
  root /usr/share/nginx/html/app;
  client_max_body_size 12M;
  location /api/ {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
  }
  location / { try_files $uri /index.html; }
}

# Redirect HTTP -> HTTPS cho toan bo domain
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}
